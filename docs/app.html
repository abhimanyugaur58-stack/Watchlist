<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<!-- WATCHLIST-APP-PAGE -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>वॉच-लिस्ट</title>
<style>
/* Layout: phone app shell — one scrolling screen at a time, bottom tab bar on the three main tabs. Dark only, by design. */
:root {
  /* Night-time study of a power drama: deep navy with brass. Brass marks what you act on and what you have watched;
     orange is kept for things that need checking. */
  --bg: #0D1628;
  --surface: #15203A;
  --surface2: #1C2A48;
  --fg: #EEF1F7;
  --muted: #A3AEC6;
  --dim: #76829E;
  --line: #2A3A5E;
  --accent: #E3BD6C;
  --accent-bg: #3A3322;
  --primary: #D4A64A;
  --on-primary: #0D1628;
  --ok: #72D29B; --ok-bg: #123329;
  --warn: #F29B66; --warn-bg: #3D2718;
  --likely: #A3B8F5; --likely-bg: #1E2C54;
  --danger: #F28B82; --danger-line: #6E2E33;
  --font-display: "Noto Serif Devanagari", "Noto Serif", serif;
  --font-body: "Noto Sans Devanagari", "Roboto", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }

#app { height: 100%; display: flex; flex-direction: column; }
.screen { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
.screen[hidden] { display: none !important; }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 22px 20px 10px; }
.head.small { align-items: center; padding: 12px 12px 6px; justify-content: flex-start; gap: 6px; }
.title { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.2; }
.title.sm { font-size: 22px; }
.subtitle { font-size: 13px; color: var(--muted); }
.body { display: flex; flex-direction: column; gap: 18px; padding: 6px 20px 24px; }
.icon-btn { width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--surface); color: var(--fg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.icon-btn.bare { background: transparent; }

.card { background: var(--surface); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.card.tight { border-radius: 16px; padding: 14px; gap: 10px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--accent); }
.eyebrow.warn { color: var(--warn); }
.tile { width: 64px; height: 96px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 34px; color: var(--fg); flex-shrink: 0; }
img.tile { display: block; object-fit: cover; background: var(--surface2); }
.tile.big { width: 96px; height: 144px; border-radius: 14px; font-size: 44px; box-shadow: 0 12px 28px rgba(0, 0, 0, .45); }
.tile.sm { width: 36px; height: 54px; border-radius: 7px; font-size: 17px; }
#scr-detail { position: relative; isolation: isolate; }
.hero { display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
/* The poster, blurred, behind the top of the detail screen; it fades into the page colour. */
.hero-bg { position: absolute; top: 0; left: 0; right: 0; height: 380px; z-index: -1; overflow: hidden; pointer-events: none; }
.hero-bg::before { content: ""; position: absolute; inset: -40px; background-image: var(--poster, none); background-size: cover; background-position: center 30%; filter: blur(26px) saturate(1.2); opacity: .6; }
.hero-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 0%, var(--bg) 100%); }
.poster-btn { position: relative; flex-shrink: 0; padding: 0; border: 0; background: none; border-radius: 14px; }
.poster-btn .edit { position: absolute; right: -6px; bottom: -6px; width: 30px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; background: var(--surface2); color: var(--accent); box-shadow: 0 0 0 2px var(--bg); }
.searchrow { display: flex; gap: 8px; align-items: flex-end; }
.picks { display: flex; flex-direction: column; gap: 8px; }
.pick { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); text-align: left; }
.pick img, .pick-noimg { width: 44px; height: 66px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--surface2); display: flex; align-items: center; justify-content: center; color: var(--muted); }
.pick-cta { font-size: 13px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.hint { font-size: 12px; color: var(--dim); }
.grid2[hidden] { display: none; }
.linked { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 14px; border: 1px solid var(--accent); background: var(--surface); }
.linked img, .linked .pick-noimg { width: 56px; height: 84px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: var(--surface2); }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; margin: 0; font-size: 14px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; color: var(--fg); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.next-ep { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--accent-bg); color: var(--accent); font-size: 14px; font-weight: 700; }
.next-ep svg { flex-shrink: 0; }
.diary.diary-row { flex-direction: row; gap: 12px; align-items: flex-start; }
.empty-art { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 28px 12px; color: var(--dim); text-align: center; }
.seal { flex-shrink: 0; }
.seal.outline { color: var(--dim); }
.seal-overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: rgba(5, 9, 18, .74); transition: opacity .35s; }
.seal-overlay.out { opacity: 0; }
.seal-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 24px; text-align: center; animation: stamp .6s cubic-bezier(.2, .9, .3, 1.25) both; }
.seal-title { font-family: var(--font-display); font-weight: 700; font-size: 30px; color: var(--accent); margin-top: 8px; }
.seal-name { font-size: 16px; color: var(--fg); }
@keyframes stamp { 0% { transform: scale(1.8) rotate(-16deg); opacity: 0; } 60% { transform: scale(.94) rotate(3deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .seal-wrap { animation: none; } .seal-overlay { transition: none; } }
.row { display: flex; gap: 14px; align-items: center; }
.col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.name-lg { font-size: 24px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; background: none; border: 0; padding: 0; text-align: left; color: var(--fg); }
.meta { font-size: 13px; color: var(--muted); }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar > div { height: 100%; border-radius: 4px; background: var(--accent); }
.bar.thin { height: 6px; }
.split { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.btn { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--fg); font-size: 14px; }
.btn.primary { border: 0; background: var(--primary); color: var(--on-primary); font-weight: 700; }
.btn.big { min-height: 58px; border-radius: 16px; font-size: 19px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.btn.wide { width: 100%; }
.btn.danger { border-color: var(--danger-line); color: var(--danger); }
.btn.dashed { border-style: dashed; color: var(--muted); }
.btn:disabled { color: var(--dim); cursor: default; }
.link { background: none; border: 0; color: var(--accent); font-size: 14px; padding: 8px 0; }

.section-title { font-size: 17px; font-weight: 700; }
.section-label { font-size: 15px; font-weight: 700; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 8px; }
.qrow { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 12px; border-radius: 14px; background: var(--surface); border: 0; width: 100%; text-align: left; color: var(--fg); }
.qrow.current { background: var(--surface2); box-shadow: inset 0 0 0 1px var(--primary); }
.qrow.done .qname { text-decoration: line-through; color: var(--muted); }
.qnum { width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--surface2); color: var(--accent); }
.qrow.current .qnum { background: var(--primary); color: var(--on-primary); }
.qrow.done .qnum { background: none; }
.qname { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
.qmeta { font-size: 12px; color: var(--muted); }
.pill { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 10px; background: var(--accent-bg); color: var(--accent); white-space: nowrap; }
.chev { flex-shrink: 0; color: var(--muted); }
.upnext { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border-radius: 16px; border: 0; width: 100%; text-align: left; color: var(--fg); }
.upnum { width: 28px; font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--accent); font-variant-numeric: tabular-nums; }
.stat { display: flex; gap: 12px; align-items: center; padding: 14px; background: var(--surface2); border-radius: 16px; font-size: 14px; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.fchip { height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: 14px; }
.fchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 700; }
.tag { font-size: 12px; padding: 3px 10px; border-radius: 10px; background: var(--surface2); color: var(--muted); }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.likely { background: var(--likely-bg); color: var(--likely); }
.tag.check { background: var(--warn-bg); color: var(--warn); }
.h-ok { color: var(--ok); } .h-likely { color: var(--likely); } .h-check { color: var(--warn); }

.seasons { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.schip { min-width: 44px; height: 40px; flex-shrink: 0; padding: 0 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); color: var(--fg); font-size: 14px; font-weight: 700; }
.schip.past { background: var(--ok-bg); color: var(--ok); }
.schip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.stepper { display: grid; grid-template-columns: 56px minmax(0, 1fr) 56px; align-items: center; gap: 10px; }
.step { width: 56px; height: 56px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface2); color: var(--fg); display: flex; align-items: center; justify-content: center; }
.step.plus { border: 0; background: var(--primary); color: var(--on-primary); }
.count { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.count b { font-family: var(--font-display); font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.count small { font-size: 18px; color: var(--muted); }

.char { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border-radius: 14px; background: var(--surface); }
.char .cn { font-size: 15px; font-weight: 700; }
.char .ct { font-size: 12px; }
.x { width: 32px; height: 32px; border: 0; border-radius: 16px; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; }
.ct-0 { color: var(--accent); } .ct-1 { color: var(--likely); } .ct-2 { color: var(--warn); } .ct-3 { color: var(--ok); } .ct-4 { color: #C7A6F2; }
.note { display: flex; gap: 8px; align-items: flex-start; padding: 12px 8px 12px 14px; border-radius: 14px; background: var(--surface); }
.note .nl { font-size: 12px; color: var(--muted); }
.note .nt { font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-line; }

.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); min-width: 0; }
.field input, .field select, .field textarea { min-height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-size: 15px; width: 100%; }
.field textarea { padding: 10px 12px; min-height: 76px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.err { color: var(--danger); font-size: 13px; }
.panel { background: var(--surface2); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.scores { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; max-width: 560px; }
.score { height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); color: var(--fg); font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.score[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-primary); }
.diary { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 16px; background: var(--surface); }
.diary-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.diary-name { font-size: 17px; font-weight: 700; background: none; border: 0; padding: 0; color: var(--fg); text-align: left; }
.rating { font-size: 15px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.quote { font-size: 15px; line-height: 1.5; }
.empty { color: var(--muted); font-size: 14px; }
.footer-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--line); background: var(--surface); flex-shrink: 0; }
.footer-actions[hidden] { display: none; }
.code { width: 100%; min-height: 96px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-family: monospace; font-size: 12px; word-break: break-all; resize: none; }
a.btn { display: flex; align-items: center; justify-content: center; text-decoration: none; }

nav.tabs { height: 74px; flex-shrink: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; background: var(--surface); border-top: 1px solid var(--line); padding: 0 8px; }
nav.tabs[hidden] { display: none; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: transparent; color: var(--muted); font-size: 12px; min-height: 56px; justify-content: center; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 700; }
.fab { justify-self: center; width: 56px; height: 56px; border: 0; border-radius: 28px; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; }

#snack { position: fixed; left: 16px; right: 16px; bottom: 86px; background: var(--fg); color: var(--bg); border-radius: 14px; padding: 10px 10px 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
#snack[hidden] { display: none; }
#snack.low { bottom: 16px; }
#snack button { border: 0; background: transparent; color: #7A5200; font-weight: 700; font-size: 14px; min-height: 40px; padding: 0 8px; }
@media (max-width: 360px) { .grid2 { grid-template-columns: 1fr; } .title { font-size: 26px; } }

/* ---------- Tablet ----------
   Phone: bottom tab bar, one screen at a time.
   From 600px wide (tablet upright, phone sideways): a navigation rail on the left and content kept to a readable width.
   From 840px wide (tablet sideways): the list and the series detail sit side by side, like Gmail or Netflix on a tablet. */
#stage { flex: 1; min-height: 0; min-width: 0; display: flex; }
.pane { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; }
.pane[hidden] { display: none !important; }
.screen > .head, .screen > .body { width: 100%; max-width: var(--maxw, none); margin-left: auto; margin-right: auto; }
.tab .ind { display: flex; align-items: center; justify-content: center; width: 56px; height: 32px; border-radius: 16px; }
.tab.settings { display: none; }
.fab { order: 4; }
nav.tabs { order: 2; }
.now-side { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.pane-empty { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 32px; color: var(--muted); font-size: 15px; }
.qrow.sel, .diary.sel { background: var(--surface2); box-shadow: inset 4px 0 0 var(--accent); }
.has-dot { position: relative; }
.has-dot::after { content: ""; position: absolute; top: 4px; right: 4px; width: 10px; height: 10px; border-radius: 5px; background: var(--warn); box-shadow: 0 0 0 2px var(--surface); }
.whatsnew { border: 1px solid var(--ok-bg); }
.notes { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
#scr-now .now-grid > .span-all { grid-column: 1 / -1; }
.qrow.current.sel { box-shadow: inset 4px 0 0 var(--accent), inset 0 0 0 1px var(--primary); }

@media (min-width: 600px) {
  #app { flex-direction: row; }
  nav.tabs { order: 0; width: 92px; height: auto; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 0 14px; border-top: 0; border-right: 1px solid var(--line); overflow-y: auto; }
  .fab { order: 0; flex-shrink: 0; border-radius: 16px; margin-bottom: 16px; }
  .tab { width: 80px; min-height: 64px; flex-shrink: 0; gap: 4px; }
  .tab[aria-current="page"] .ind { background: var(--accent-bg); }
  .tab.settings { display: flex; margin-top: auto; }
  .hide-rail { display: none !important; }
  .screen { --maxw: 720px; }
  .head { padding-top: 28px; }
  #snack { left: 108px; right: auto; width: min(480px, calc(100% - 124px)); }
}
@media (min-width: 600px) and (max-height: 520px) {
  nav.tabs { gap: 2px; padding: 10px 0; }
  .fab { width: 48px; height: 48px; margin-bottom: 6px; }
  .tab { min-height: 52px; }
}
@media (min-width: 840px) {
  #scr-now { --maxw: 1100px; }
  #scr-now .body.now-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  #scr-settings { --maxw: 1040px; }
  #scr-settings .body.settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
  #scr-settings .settings-grid > .span2 { grid-column: 1 / -1; }
  #scr-add { --maxw: 680px; }
  #stage.two > .screen:not([hidden]) { flex: 0 0 clamp(340px, 38%, 440px); border-right: 1px solid var(--line); --maxw: none; }
  #stage.two #scr-detail { --maxw: 820px; }
}
</style>
</head>
<body>
<div id="app">
  <nav class="tabs" id="tabs" aria-label="मुख्य मेनू"></nav>
  <div id="stage">
    <section class="screen" id="scr-now" aria-label="अभी"></section>
    <section class="screen" id="scr-queue" aria-label="सूची" hidden></section>
    <section class="screen" id="scr-finished" aria-label="देख लीं" hidden></section>
    <div class="pane" id="detail-pane" hidden>
      <section class="screen" id="scr-detail" aria-label="सीरीज़ विवरण"></section>
      <div class="footer-actions" id="detail-actions" hidden></div>
    </div>
    <section class="screen" id="scr-add" aria-label="नई सीरीज़" hidden></section>
    <section class="screen" id="scr-settings" aria-label="सेटिंग और बैकअप" hidden></section>
  </div>
</div>
<div id="snack" role="status" aria-live="polite" hidden><span id="snack-text"></span><button type="button" id="snack-undo">वापस करें</button></div>

<script>
'use strict';
/* ---------- Catalog ---------- */
const CATALOG = {
  suits: { name: "Suits", where: "Netflix", hindi: "ok", why: "हार्वी, डोना, जेसिका और लुइस की कहानी पूरी कीजिए।", seasons: [12, 16, 16, 16, 16, 16, 16, 16, 10] },
  hoc: { name: "House of Cards", where: "Netflix", hindi: "ok", why: "आपकी पक्की अगली सीरीज़। फ़्रैंक, क्लेयर और डग स्टैम्पर, यानी सत्ता एक भूख।", seasons: [13, 13, 13, 13, 13, 8] },

      A.results.length ? h("div", { class: "picks", "aria-label": "इंटरनेट से सुझाव" }, A.results.map(r => h("button", { class: "pick", type: "button", onclick: () => pick(r) },
        r.img ? h("img", { src: r.img, alt: "", loading: "lazy" }) : h("span", { class: "pick-noimg", "aria-hidden": "true" }, "?"),
        h("span", { class: "col", style: "gap:2px;flex:1;min-width:0" }, h("b", { text: r.name }), h("span", { class: "meta", text: [r.year, r.net].filter(Boolean).join(" · ") })),
        h("span", { class: "pick-cta", text: "यही है" })))) : null].filter(Boolean));
    sugg.style.display = A.msg || A.results.length ? "" : "none";
    const L = A.link;
    const exact = L && L.info && L.info.seasons.length ? L.info : null;
    linkBox.replaceChildren();
    if (L) {
      const dupe = seriesWithTv(L.tv);
      const line = L.manual ? "एपिसोड की गिनती नीचे आप ख़ुद लिखेंगे।"
        : exact ? countText(exact.seasons) + (exact.seasons.length > 1 ? " (" + exact.seasons.join(", ") + ")" : "")
        : L.loading ? "एपिसोड गिन रहा हूँ…" : "इंटरनेट पर एपिसोड की गिनती नहीं मिली। नीचे ख़ुद लिख दीजिए।";
      linkBox.append(h("div", { class: "linked" },
        L.img ? h("img", { src: L.img, alt: "" }) : h("span", { class: "pick-noimg", "aria-hidden": "true" }, "?"),
        h("div", { class: "col", style: "gap:4px;flex:1;min-width:0" },
          h("span", { class: "eyebrow", text: "इंटरनेट से जुड़ गई" }),
          h("b", { style: "font-size:16px", text: L.name }),
          h("span", { class: "meta", text: [exact ? yearsText(exact) : L.year, L.net].filter(Boolean).join(" · ") }),
          h("span", { style: "font-size:14px", text: line }),
          dupe ? h("span", { style: "font-size:13px;color:var(--warn)", text: "ध्यान दें: “" + base(dupe).name + "” आपकी सूची में पहले से है।" }) : null,
          h("div", { class: "actions", style: "margin-top:4px" },
            h("button", { class: "btn", type: "button", onclick: unlink }, "यह नहीं"),
            exact ? h("button", { class: "link", type: "button", onclick: () => { L.manual = !L.manual; drawAdd(); if (L.manual) sc.focus(); } }, L.manual ? "इंटरनेट वाली गिनती लें" : "गिनती ख़ुद लिखें") : null))));
    }
    linkBox.style.display = L ? "" : "none";
    counts.hidden = Boolean(L && !L.manual && (exact || L.loading));
  }
  drawAdd = draw;

  name.addEventListener("input", () => {
    A.name = name.value;
    const q = name.value.trim();
    if (A.link && q !== A.link.name) A.link = null;
    clearTimeout(addTimer);
    if (A.link || q.length < 2) { addSeq++; A.results = []; A.msg = ""; drawAdd(); return; }
    addTimer = setTimeout(() => addSearch(A, q), 550);
    drawAdd();
  });
  where.addEventListener("input", () => { A.where = where.value; A.whereAuto = false; });
  sc.addEventListener("input", () => { A.seasons = sc.value; });
  ep.addEventListener("input", () => { A.eps = ep.value; });
  hi.addEventListener("change", () => { A.hindi = hi.value; });
  pl.addEventListener("change", () => { A.place = pl.value; });
  why.addEventListener("input", () => { A.why = why.value; });

  const form = h("form", { class: "body", novalidate: true },
    h("label", { class: "field", for: "add-name" }, "सीरीज़ का नाम *", name),

    err, sugg, linkBox,
    h("label", { class: "field", for: "add-where" }, "कहाँ है", where),
    counts,
    h("div", { class: "grid2" }, h("label", { class: "field", for: "add-hindi" }, "हिंदी", hi), h("label", { class: "field", for: "add-place" }, "कहाँ रखें", pl)),
    h("label", { class: "field", for: "add-why" }, "क्यों देखनी है (चाहें तो)", why),
    h("button", { class: "btn primary big", type: "submit", style: "font-size:17px;min-height:52px" }, "जोड़ें"));
  form.addEventListener("submit", e => {
    e.preventDefault();
    const n = name.value.trim();
    if (!n) { err.hidden = false; name.focus(); return; }
    const L = A.link;
    const exact = L && !L.manual && L.info && L.info.seasons.length ? L.info : null;
    const sCount = Math.min(40, Math.max(0, parseInt(sc.value, 10) || 0));
    const eCount = Math.min(100, Math.max(0, parseInt(ep.value, 10) || 0));
    const id = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    const target = pl.value;
    clearTimeout(addTimer); addSeq++;
    ui.add = null;
    change(() => {
      state.custom[id] = { name: n, where: where.value.trim(), hindi: hi.value, why: why.value.trim(),
        seasons: exact ? exact.seasons.slice() : (sCount && eCount ? Array(sCount).fill(eCount) : null),
        epsText: exact ? "" : (sCount && !eCount ? sCount + " सीज़न" : "") };
      if (exact && exact.labels) state.custom[id].labels = exact.labels.slice();
      if (L) state.tv[id] = L.tv;
      place(id, target);
    }, null);
    tabGo("queue");
    snack("“" + n + "” जुड़ गई", true);
    if (L) loadPoster(L.tv, L.img).then(ok => { if (ok) refreshPosters(id); });
    setTimeout(fetchPosters, 300);
  });
  el.replaceChildren(head, form);
  draw();
}

function renderUpdateCard() {

    h("div", { class: "split" }, h("h2", { class: "section-title", style: "color:var(--fg)", text: "अपडेट" }), h("span", { class: "tag", text: "आपका संस्करण " + VERSION })));

    h("a", { class: "btn primary big", href: APK_URL, style: "font-size:16px;min-height:52px" }, icon("download", 20), "नया ऐप डाउनलोड करें"));

  card.append(h("button", { class: "btn wide", type: "button", style: "min-height:48px", disabled: st === "checking", onclick: () => checkUpdate(true) }, "अभी अपडेट जाँचें"),
    h("p", { class: "meta", style: "font-size:13px", text: "नया फ़ीचर Claude से चैट में माँगिए। वह उसे आपकी GitHub वाली जगह पर डाल देगा, और यह ऐप खुलते ही उसे ले लेगा। फ़ोन और टैब, दोनों में।" }));

function renderSettings() {

    h("p", { class: "meta", style: "font-size:14px", text: "फ़ोन बदले या ऐप हट जाए, तो यह कोड आपकी पूरी सूची, टिक, अंक और नोट्स वापस ले आएगा। कोड कॉपी करके WhatsApp पर ख़ुद को भेज दीजिए।" }),
    h("p", { class: "meta", style: "font-size:13px", text: "फ़ोन और टैब की सूची अलग-अलग सेव होती है। एक की सूची दूसरे में लानी हो, तो यही कोड दूसरे में \"बैकअप से वापस लाएँ\" में चिपकाइए।" }),
    h("button", { class: "btn primary big", type: "button", style: "font-size:16px;min-height:52px", onclick: () => {
      state.lastBackup = Date.now(); save();
      const code = backupCode();
      ui.backupShown = code;
      const done = ok => {
        ui.copyMsg = ok ? "कोड कॉपी हो गया। अब WhatsApp पर ख़ुद को भेज दीजिए।" : "कोड नीचे है। उसे दबाकर रखिए, \"सब चुनें\" और फिर \"कॉपी\" कीजिए। या सीधे WhatsApp वाला बटन दबाइए।";
        ui.copyOk = ok;
        render();
      };
      // The old copy command works inside the app's WebView; the newer clipboard API is the fallback.
      let ok = false;
      const ta = document.createElement("textarea");
      ta.value = code; ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";
      document.body.append(ta);
      try { ta.select(); ta.setSelectionRange(0, code.length); ok = document.execCommand("copy"); } catch (e) { ok = false; }
      ta.remove();
      if (ok) done(true);
      else if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(() => done(true), () => done(false));
      else done(false);
    } }, icon("copy", 20), "बैकअप कोड कॉपी करें"));
  if (ui.backupShown) {
    codeBox.value = ui.backupShown;
    backupCard.append(h("p", { style: "font-size:14px;color:" + (ui.copyOk ? "var(--ok)" : "var(--warn)"), text: ui.copyMsg }), codeBox,
      h("a", { class: "btn wide", href: "whatsapp://send?text=" + encodeURIComponent(ui.backupShown), style: "min-height:48px" }, "WhatsApp पर भेजें"));

  const input = h("textarea", { id: "restore-code", placeholder: "कोड यहाँ", style: "min-height:72px" });
  input.value = ui.restoreDraft || "";
  const restoreCard = h("section", { class: "card", style: "border-radius:20px;padding:16px;gap:12px" },
    h("h2", { class: "section-title", text: "बैकअप से वापस लाएँ" }),

      h("div", { class: "actions" },
        h("button", { class: "btn primary", type: "button", onclick: () => {

  } else {

      ui.restoreDraft = input.value;

      if (!parsed) { ui.restoreMsg = "यह कोड सही नहीं लग रहा। पूरा कोड चिपकाइए, जो WL2: से शुरू होता है।"; render(); return; }
      ui.restoreMsg = ""; ui.restoreConfirm = parsed; render();

  }
  if (ui.restoreMsg) restoreCard.append(h("p", { class: "err", text: ui.restoreMsg }));
  body.append(restoreCard);

  body.append(h("section", { class: "col span2", style: "gap:8px" },
    h("button", { class: "btn dashed", type: "button", style: "min-height:48px;border-radius:14px", disabled: state.removed.length === 0, onclick: () => change(() => {
      for (const id of state.removed) { const L = LISTS.find(x => DEFAULT_LAYOUT[x].includes(id)) || "main"; state.layout[L].push(id); }
      state.removed = [];
    }, "हटाई गई सीरीज़ वापस आ गईं") }, "हटाई गई सीरीज़ वापस लाएँ (" + state.removed.length + ")"),
    h("p", { class: "meta", style: "text-align:center;font-size:12px", text: "संस्करण " + VERSION + " (" + BUILD + (SHELL ? ", ढाँचा " + SHELL : "") + ") · आपकी सूची इसी डिवाइस में सेव" }),
    h("p", { class: "meta", style: "text-align:center;font-size:12px" }, "पोस्टर और सीरीज़ की जानकारी: ", h("a", { href: "https://www.tvmaze.com", style: "color:var(--accent)" }, "TVmaze"), " (CC BY-SA)")));
  el.replaceChildren(head, body);
}

function renderTabs(active) {
  const nav = document.getElementById("tabs");
  // Phone: bottom bar only on the three tabs. Tablet: the rail stays on every screen.
  nav.hidden = !isMedium() && !TABS.includes(screen);
  const tab = (id, label, ic) => h("button", { class: "tab", type: "button", "aria-current": active === id ? "page" : null, onclick: () => tabGo(id) }, h("span", { class: "ind" }, icon(ic, 24)), label);
  nav.replaceChildren(
    h("button", { class: "fab", type: "button", "aria-label": "नई सीरीज़ जोड़ें", onclick: () => { if (screen !== "add") { ui.add = null; go("add"); } } }, icon("plus", 26)),
    tab("now", "अभी", "play"), tab("queue", "सूची", "list"), tab("finished", "देख लीं", "star"),
    h("button", { class: "tab settings", type: "button", "aria-current": active === "settings" ? "page" : null, onclick: () => { if (screen !== "settings") go("settings"); } }, h("span", { class: "ind" + (backupDue() ? " has-dot" : "") }, icon("gear", 24)), "सेटिंग"));
}

function render() {
  const two = isWide() && (screen === "queue" || screen === "finished" || screen === "detail");
  const listTab = screen === "detail" ? (ui.detailFrom || "queue") : screen;
  view.two = two; view.listTab = listTab;
  view.paneId = two ? (screen === "detail" ? detailId : selFor(listTab)) : null;
  const shown = two ? listTab : (screen === "detail" ? null : screen);
  for (const s of ["now", "queue", "finished", "add", "settings"]) document.getElementById("scr-" + s).hidden = s !== shown;
  const paneOn = two || screen === "detail";
  document.getElementById("detail-pane").hidden = !paneOn;
  document.getElementById("stage").classList.toggle("two", two);
  if (shown === "now") renderNow();
  else if (shown === "queue") renderQueue();
  else if (shown === "finished") renderFinished();
  else if (shown === "add") renderAdd();
  else if (shown === "settings") renderSettings();
  if (paneOn) renderDetail(two ? view.paneId : detailId, two);
  else document.getElementById("detail-actions").hidden = true;
  renderTabs(screen === "detail" ? (ui.detailFrom || "queue") : screen);
  placeSnack();
}
// Re-draw only when the screen crosses a size step (turning the tablet), not when the keyboard opens.
for (const m of [MQ_MEDIUM, MQ_WIDE]) {
  if (m.addEventListener) m.addEventListener("change", () => render());
  else if (m.addListener) m.addListener(() => render());
}

try { history.replaceState({ scr: "now" }, ""); } catch (e) {}
save();
render();
// Reached the first screen: tell the starter page this version opens fine.
try { localStorage.removeItem("wl-boot"); } catch (e) {}
if (SHELL) setTimeout(() => checkUpdate(false), 1200);
setTimeout(fetchPosters, SHELL ? 2500 : 600);
